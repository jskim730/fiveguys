# ── ELICE (course-provided) generator API credentials ──────────────
# Copy this file to  config/secrets.yaml  (already git-ignored) and fill it in.
# The professor said KEEP IT CONFIDENTIAL — never commit secrets.yaml or paste
# the key/URL into chat or code. Put the two redacted values here only.

generator:
  provider: elice                   # ELICE proxy (OpenAI-compatible chat payload)
  api_url:  "<ELICE_API_URL>"       # the URL from the professor  (GPT-5-mini endpoint)
  api_key:  "<ELICE_API_KEY>"       # the key from the professor
  model:    "openai/gpt-5-mini"     # model id used in the professor's example

# Optional: embedding API, if Qwen3-4B is served the same way instead of running locally.
# embedding:
#   provider: openai_compatible
#   base_url: "https://<endpoint>/v1"
#   api_key:  "<key>"
#   model:    "Qwen/Qwen3-Embedding-4B"
